---
name: Build macOS
permissions:
  contents: read

on:
  push:
    branches: [ "main" ]

jobs:
  build:
      strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - os: macos-26
            qt_version: 6.11.2

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install node
          npm install --global create-dmg

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          set-env: ${{ runner.os != 'Windows' }}
          add-tools-to-path: ${{ runner.os != 'Windows' }}
          tools: ${{ runner.os == 'Windows' && 'tools_qtcreator_gui' || '' }}
          version: ${{ matrix.qt_version }}
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'

      - name: Upload Binaries (macOS)
        uses: actions/upload-artifact@v6
        if: runner.os == 'macOS'
        with:
          name: pwt-${{ runner.os }}-test
          path: build/installer-Release/*.dmg
          compression-level: 0
          if-no-files-found: error
