name: Build MacOS .dmg

on:
  push:
    branches: ["master"]

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          set-env: ${{ runner.os != 'Windows' }}
          add-tools-to-path: ${{ runner.os != 'Windows' }}
          tools: ${{ runner.os == 'Windows' && 'tools_qtcreator_gui' || '' }}
          version: 5.15.2
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'

      - name: Configure and Build
        run: |
            mkdir build && cd build
            qmake ../tether.pro CONFIG+=release
            make -j 2

      - name: Run macdeployqt
        run: |
          # make the .dmg image
          cd build
          macdeployqt tether.app -dmg

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: tether-${{ runner.os }}
          path: build/*.dmg

