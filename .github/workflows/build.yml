name: Build macOS

on:
  push:
    branches: ["master"]

jobs:
  build:
    runs-on: macos-26
    strategy:
      matrix:
        qt_version: [5.15.2]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install node
          npm install --global create-dmg

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          set-env: ${{ runner.os != 'Windows' }}
          add-tools-to-path: ${{ runner.os != 'Windows' }}
          tools: ${{ runner.os == 'Windows' && 'tools_qtcreator_gui' || '' }}
          version: ${{ matrix.qt_version }}
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'

      - name: Configure and build
        run: |
            mkdir build && cd build
            qmake ../tether.pro CONFIG+=release
            make -j 2

      - name: Run macdeployqt
        run: |
          # Locate macdeployqt from your Qt installation path or let it run from environment
          macdeployqt build/tether.app -dmg

      - name: Create DMG
        run: |
          create-dmg \
            --volname "tether" \
            --volicon "path/to/icon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "tether.app" 175 190 \
            --app-drop-link 425 190 \
            "tether-Installer.dmg" \
            "build/tether.app"

      - name: Upload Binaries (macOS)
        uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: pwt-${{ runner.os }}-test
          path: build/*.dmg

