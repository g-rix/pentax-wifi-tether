name: Build macOS

on:
  push:
    branches: ["master"]

jobs:
  build:
    runs-on: macos-15
    strategy:
      matrix:
        qt_version: [6.8.1]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install node
          npm install --global create-dmg

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          set-env: ${{ runner.os != 'Windows' }}
          add-tools-to-path: ${{ runner.os != 'Windows' }}
          tools: ${{ runner.os == 'Windows' && 'tools_qtcreator_gui' || '' }}
          version: ${{ matrix.qt_version }}
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'

      - name: Configure
        run: qmake tether.pro CONFIG+=release

      - name: Build
        run: make -j 2

      - name: Upload Binaries (macOS)
        uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: pwt-${{ runner.os }}-test
          path: build/installer-Release/*.dmg

